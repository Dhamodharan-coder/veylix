# Veylix: run with `docker compose up --build`
# Reads configuration from .env (DATABASE_URL, DIRECT_URL, BETTER_AUTH_*, ENCRYPTION_KEY, ...).
name: veylix

services:
  # Applies pending Prisma migrations, then exits.
  migrate:
    build:
      context: .
      target: migrate
    image: veylix-migrate:latest
    env_file: .env
    restart: "no"

  app:
    build:
      context: .
      target: runner
    image: veylix:latest
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
